</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="surface" width="100%" height="100%"/>
<text class="ink" x="24" y="38" font-size="15" font-weight="600">Control structure: rolloutSystem</text>
<rect class="f1" x="24" y="51" width="12" height="12" rx="2"/><text class="ink2" x="42" y="61" font-size="12">controller</text>
<rect class="f3" x="134.0" y="51" width="12" height="12" rx="2"/><text class="ink2" x="152.0" y="61" font-size="12">process</text>
<path class="edge" d="M222.4,57 h28" marker-end="url(#arrow)"/><text class="ink2" x="258.4" y="61" font-size="12">control action</text>
<path class="edge fb" d="M379.20000000000005,57 h28" marker-end="url(#arrow)"/><text class="ink2" x="415.20000000000005" y="61" font-size="12">feedback</text>
<path class="edge" d="M106.0,128.0 L106.0,172.0 L106.0,216.0" marker-end="url(#arrow)"><title>control action pushConfig, rollback: rolloutController → batch</title></path>
<path class="edge fb" d="M134.0,216.0 L134.0,172.0 L134.0,128.0" marker-end="url(#arrow)"><title>feedback healthReport, errorRate: batch → rolloutController</title></path>
