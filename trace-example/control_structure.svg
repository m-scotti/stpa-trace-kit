<svg xmlns="http://www.w3.org/2000/svg" width="497" height="288" viewBox="0 0 497 288" role="img">
<title>Control structure: rolloutSystem</title>
<style>
  .surface { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
  .edge { fill: none; stroke: #52514e; stroke-width: 2; }
  .fb { stroke-dasharray: 6 4; }
  .arrow { fill: #52514e; }
  .box { fill: #fcfcfb; stroke-width: 2; }
