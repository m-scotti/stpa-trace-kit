<g><title>feedback healthReport, errorRate: batch → rolloutController</title><text class="ink" font-size="11" text-anchor="start"><tspan x="142.0" y="169.0">healthReport</tspan><tspan x="142.0" y="183.0">errorRate</tspan></text></g>
<g><title>rolloutController (controller)</title><rect class="box g1" x="38.2" y="80.0" width="163.6" height="48" rx="4"/><rect class="f1" x="39.2" y="81.0" width="6" height="46" rx="2"/><text class="ink" x="123.0" y="101.0" font-size="13" font-weight="600" text-anchor="middle">rolloutController</text><text class="ink2" x="123.0" y="117.0" font-size="11" text-anchor="middle">controller</text></g>
<g><title>batch (process)</title><rect class="box g3" x="72.0" y="216.0" width="96.0" height="48" rx="4"/><rect class="f3" x="73.0" y="217.0" width="6" height="46" rx="2"/><text class="ink" x="123.0" y="237.0" font-size="13" font-weight="600" text-anchor="middle">batch</text><text class="ink2" x="123.0" y="253.0" font-size="11" text-anchor="middle">process</text></g>
